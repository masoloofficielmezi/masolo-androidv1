<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eceef1; color: #1a1f2b;
           font-family: sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .logo { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 24px; background: #12306b; color: #d9c29a;
            display: grid; place-items: center; font-size: 44px; font-weight: 800; }
    h1 { color: #12306b; margin: 0 0 8px; font-size: 1.4rem; }
    p { color: #5c6370; margin: 0 0 24px; }
    a { display: inline-block; background: #12306b; color: #f4efe4; text-decoration: none; border-radius: 14px;
        padding: 14px 28px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="logo">M</div>
    <h1>Connexion impossible</h1>
    <p>Vérifiez votre connexion internet, puis réessayez.</p>
    <a href="masolo-retry://now">Réessayer</a>
  </main>
</body>
</html>
