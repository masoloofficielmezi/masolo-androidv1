org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ============ À ADAPTER ============
# Adresse de votre serveur Masolo (se termine par « / »).
# Débogage : émulateur Android -> http://10.0.2.2/masolo/   |   téléphone sur le même Wi-Fi -> http://192.168.X.X/masolo/
MASOLO_DEBUG_URL=http://10.0.2.2/masolo/
# Production : HTTPS obligatoire
MASOLO_PROD_URL=https://masolo.example.com/

# Signature de la version « release » (facultatif : sans cela, l'APK release est signé avec la clé de débogage, installable pour tester)
# MASOLO_KEYSTORE=C:/chemin/masolo.jks
# MASOLO_KEYSTORE_PASSWORD=...
# MASOLO_KEY_ALIAS=masolo
# MASOLO_KEY_PASSWORD=...
